<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SL-Nexus</title>
    <link rel="stylesheet" href="CSS/wp.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="stage">
      <header id="topbar">
        <div id="brand">
          <img id="brand_logo" src="Assets/sl_logo.png" alt="" />
          <span>SL-Nexus</span>
        </div>
        <a id="goto_top" href="/Code/main-site/main-site.html">Go to suite</a>
      </header>

      <div id="orbit" aria-hidden="true">
        <div id="orbit_disc">
          <div id="bg_pattern_div">
            <img id="bg_pattern" src="Assets/bg_pattern.svg" alt="" />
          </div>
          <div id="ring">
            <span class="node node--top"></span>
            <span class="node node--left"></span>
            <span class="node node--right"></span>
          </div>
          <img id="sl_logo" src="Assets/sl_logo.png" alt="" />
        </div>
      </div>

      <section id="hero">
        <h1 id="hero_title">Everything in SL-Nexus, one place to start</h1>
        <p id="hero_text">
          THE NEXUS SUITE BRINGS YOUR TOOLS<br />
          TOGETHER BEHIND A SINGLE DOOR.
        </p>
        <a id="goto_suite" href="/Code/main-site/main-site.html">
          <span>Go to suite</span>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              d="M4 12 12 4M5 4h7v7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
        </a>
      </section>

      <footer>
  <p>
    *All code is written by a human and i made those graphics myself so i own their legal copyright.
  </p>
</footer>

    </main>



    <script src="JS/script.js"></script>
  </body>
</html>
